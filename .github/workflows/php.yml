name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.4'
            symfony: '5.4.*'
          - php: '8.1'
            symfony: '6.4.*'
          - php: '8.2'
            symfony: '7.4.*'
          - php: '8.3'
            symfony: '7.4.*'
          - php: '8.4'
            symfony: '8.1.*'
          - php: '8.5'
            symfony: '8.1.*'

    services:
      kafka:
        image: apache/kafka:3.9.1
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          tools: composer:v2
          extensions: rdkafka

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install dependencies for Symfony ${{ matrix.symfony }}
        env:
          SYMFONY_VERSION: ${{ matrix.symfony }}
        run: |
          composer update --prefer-dist --no-progress --no-interaction \
            --with "symfony/config:$SYMFONY_VERSION" \
            --with "symfony/dependency-injection:$SYMFONY_VERSION" \
            --with "symfony/http-kernel:$SYMFONY_VERSION" \
            --with "symfony/messenger:$SYMFONY_VERSION" \
            --with "symfony/framework-bundle:$SYMFONY_VERSION" \
            --with "symfony/serializer:$SYMFONY_VERSION" \
            --with "symfony/property-access:$SYMFONY_VERSION" \
            --with "symfony/phpunit-bridge:$SYMFONY_VERSION"

      - name: Unit and Kafka integration tests
        env:
          XDEBUG_MODE: coverage
        run: vendor/bin/simple-phpunit --log-junit results/tests/junit.xml --coverage-clover results/coverage/clover.xml

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ strategy.job-index }}-php-${{ matrix.php }}
          path: results/
          retention-days: 14

  coding-style:
    name: Coding style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Check coding style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --using-cache=no
